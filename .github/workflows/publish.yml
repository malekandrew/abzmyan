name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm test

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1; setup-node's
      # bundled npm on node 20 is older.
      - run: npm install -g npm@latest

      - run: npm publish --provenance --access public
