name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # npm's OIDC trusted publishing requires actions/setup-node v6+
      # (v4/v5 don't support it) plus npm CLI >= 11.5.1 and Node >= 22.14.0.
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm test

      - run: npm install -g npm@latest --force

      # registry-url unconditionally writes an _authToken=${NODE_AUTH_TOKEN}
      # line to .npmrc even when NODE_AUTH_TOKEN is unset. npm treats that
      # as "auth is configured" and skips the OIDC trusted-publish exchange
      # entirely, publishing anonymously instead (registry then reports a
      # misleading 404 rather than a real auth error).
      - run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"
          echo "--- .npmrc after strip ---"
          cat "$npmrc"

      # semantic-release core depends on @semantic-release/npm unconditionally
      # (regardless of which plugins we configure), which itself depends on
      # the "npm" package as a real dependency -- installing a second, older
      # npm binary into node_modules/.bin. `npx semantic-release` runs via
      # npm's own exec machinery, which prepends node_modules/.bin to PATH
      # for the whole child process tree, so every bare `npm` call made by
      # our plugins resolves to that old, OIDC-incapable local copy instead
      # of the one we just upgraded. Capture the real global npm's absolute
      # path now, before entering that tree, so we can bypass PATH lookup
      # entirely in the actual publish command.
      - run: echo "GLOBAL_NPM=$(command -v npm)" >> "$GITHUB_ENV"

      - name: Diagnose OIDC environment
        run: |
          echo "GLOBAL_NPM resolved to: $GLOBAL_NPM"
          echo "global npm version: $("$GLOBAL_NPM" --version)"
          echo "PATH-resolved npm version (may be shadowed): $(npm --version)"
          echo "node version: $(node --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
          npm config get registry

      - run: npx semantic-release --debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_LOGLEVEL: verbose
