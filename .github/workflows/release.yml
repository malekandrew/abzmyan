name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No registry-url here: it writes an _authToken=${NODE_AUTH_TOKEN}
      # line to .npmrc even when NODE_AUTH_TOKEN is unset, which makes npm
      # think auth is already configured and skips the OIDC trusted-publish
      # exchange (npm defaults to registry.npmjs.org anyway).
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - run: npm ci

      - run: npm test

      # OIDC trusted publishing requires npm CLI >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
